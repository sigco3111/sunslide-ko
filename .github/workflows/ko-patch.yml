name: Korean patch (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Korean string patch
        run: python3 tools/ko_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and build (abort before commit on failure)
        run: |
          npm ci
          npx vite build --base=/sunslide-ko/
      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests public README.md
          git commit -m "한글화 보완: 남은 화면 문구"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
