name: ko-diag (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        run: |
          echo "== package.json scripts =="
          node -e "console.log(JSON.stringify(require('./package.json').scripts))"
          echo "== ci.yml =="
          cat .github/workflows/ci.yml
          echo "== sector-stars test expectations (earned/★/star text) =="
          grep -n -e "earned" -e "★" -e "☆" -e "optional" tests/unit/sector-stars.test.js || echo none
          echo "== README lines 30-40 =="
          sed -n '30,40p' README.md
