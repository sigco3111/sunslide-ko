name: ko-diag (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        run: |
          echo "== README 번역/한글 lines =="
          grep -n -e "번역" -e "한국어" -e "translat" -e "Korean" README.md | cut -c1-300
          echo "== tests mentioning translated strings =="
          grep -rn -e "earned" -e "Best run" -e "최고" -e "별" -e "Sector" -e "moves" -e "par " -e "star" tests | cut -c1-260
          echo "== remaining English quoted UI-ish strings in src =="
          grep -rn -E "'[A-Z][a-z]+( [A-Za-z·!.,-]+)+'" src --include=*.js | grep -v -e "import" -e "console" | cut -c1-220 | head -80
          echo "== ci.yml =="
          cat .github/workflows/ci.yml | head -60
