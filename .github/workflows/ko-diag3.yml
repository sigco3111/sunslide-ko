name: ko-diag3 (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Smoke alone
        run: |
          npm ci
          npx playwright install chromium --with-deps
          npx vite build --base=/sunslide-ko/ > /tmp/build.log 2>&1 || true
          node tests/smoke.mjs > /tmp/smoke.out 2>&1 || true
          grep -n "FAIL" /tmp/smoke.out | cut -c1-400 || true
          tail -n 15 /tmp/smoke.out | cut -c1-400 || true
